name: ping
on: {schedule: [{cron: "*/10 * * * *"}], workflow_dispatch: {}}
jobs: {ping: {runs-on: ubuntu-latest, steps: [{id: ping, continue-on-error: true, run: "curl -fsS --retry 3 --retry-delay 20 --max-time 60 https://studioxxvii.onrender.com/robots.txt"}, {if: "steps.ping.outcome == 'failure'", env: {TG_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}", TG_CHAT: "${{ secrets.TELEGRAM_CHAT_ID }}"}, run: "curl -sS --max-time 30 https://api.telegram.org/bot$TG_TOKEN/sendMessage -d chat_id=$TG_CHAT --data-urlencode 'text=ALERTA: o site Studio XXVII nao responde. https://studioxxvii.onrender.com'"}, {if: "steps.ping.outcome == 'failure'", run: "exit 1"}]}}
